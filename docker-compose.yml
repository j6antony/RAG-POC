services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      -"8000:8000"
    environment:
      GEMINI_API_KEY = ${GEMINI_API_KEY}
    
    tmpfs:
      - "/app/chromadb"
      - "/app/Raw Data"
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
  
